name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  TAG_LATEST: ${{ secrets.REGISTRY_IMAGE }}:latest
  TAG_COMMIT: ${{ secrets.REGISTRY_IMAGE }}:${{ github.sha }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The integration tests boot a real mongod; caching it saves a ~100MB
      # download on every run.
      - name: Cache MongoDB binary
        uses: actions/cache@v3
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongod-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Run tests
        run: yarn test

  publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.TAG_COMMIT }} -t ${{ env.TAG_LATEST }} .
          docker push ${{ env.TAG_COMMIT }}
          docker push ${{ env.TAG_LATEST }}

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: add environment file
        run: |
          # Written with a quoted heredoc, not echo. A database password may
          # contain a backtick or a $, and echo would execute the first and
          # expand the second, silently corrupting the credential.
          cat >> .env <<'CONFIG'
          TAG_COMMIT=${{ env.TAG_COMMIT }}
          NODE_ENV=production
          # The application refuses to start without these two. It previously
          # fell back to a database URI committed in the source and to a
          # well-known signing secret; both are gone.
          MONGOLAB_URI=${{ secrets.MONGOLAB_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=12h
          CONFIG
#          scp -o StrictHostKeyChecking=no .env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/
      # Use appleboy/scp-action to securely copy both .env and docker-compose-prod.yml
      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Copy both .env and docker-compose-prod.yml to the server
          source: "./.env,./docker-compose-prod.yml"
          target: "~/.deploy/${{ github.event.repository.name }}/"
      - name: Deploy via SSH 4
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            docker login -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }} ${{ secrets.REGISTRY }}
            cd ~/.deploy/${{ github.event.repository.name }}

            # Free disk before pulling.
            #
            # The server filled up and the pull failed part-way through, leaving
            # the stack with no running app and Caddy answering 502. The old
            # `down` ran before `pull`, so the app was already gone when the
            # pull failed. Pruning first removes images no running container is
            # using (the previous finadmin release and its build layers, the bulk
            # of the space) while leaving the running database and its named
            # volume untouched. Named volumes are never removed without an
            # explicit --volumes, which is deliberately not used here.
            df -h /
            docker system prune -af

            # Pull before touching the running stack, so a failed pull leaves the
            # current release serving instead of an empty port.
            docker compose -p finadmin -f docker-compose-prod.yml pull
            docker compose -p finadmin -f docker-compose-prod.yml up -d --remove-orphans

            # Drop the image the new release replaced, so recurring deploys do
            # not accumulate until the disk fills again.
            docker image prune -af
            df -h /
          EOF
